[package]
name = "aethergate-coordinator"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Aethergate coordinator service: peg-in watcher -> FROST signing session -> ZEC release"

[[bin]]
name = "aethergate-coordinator"
path = "src/main.rs"

[dependencies]
aethergate-federation = { path = "../aethergate-federation" }
aethergate-bitcoin = { path = "../aethergate-bitcoin" }
aethergate-zcash = { path = "../aethergate-zcash" }
bitcoin = "0.32"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
